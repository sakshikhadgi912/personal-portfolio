<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    :root { --bg: #fafaf9; --text: #1c1917; --muted: #57534e; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --text: #f5f5f4; --muted: #a8a29e; --accent: #818cf8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; text-align: center; }
    h1 { font-size: 4rem; margin: 0; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page doesn't exist. <a href="javascript:history.back()">Go back</a></p>
  </main>
</body>
</html>
